services:
  - type: web
    name: clinic-queue-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-queue-db
          property: connectionString

databases:
  - name: clinic-queue-db
    plan: free
