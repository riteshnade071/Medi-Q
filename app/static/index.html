<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clinic Queue — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;vertical-align:middle;}
  :root{
    --bg:#0a0f16; --panel:#0f1620; --panel2:#121a26; --line:rgba(255,255,255,.08);
    --text:#eef3f8; --steel:#8494a6;
    --teal:#2dd4c8; --teal-soft:rgba(45,212,200,.13);
    --amber:#f5a524; --amber-soft:rgba(245,165,36,.14);
    --coral:#ff6b6b; --coral-soft:rgba(255,107,107,.14);
    --violet:#a78bfa; --violet-soft:rgba(167,139,250,.13);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 800px at 20% -10%, #0d2a28 0%, transparent 60%), var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3,h4{font-family:'IBM Plex Mono',monospace;margin:0;letter-spacing:-.02em;}
  input,button,select{font-family:inherit;}
  .grad-text{background:linear-gradient(90deg,#eef3f8,#8494a6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .app{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;}
  .brand svg{width:26px;height:26px;stroke:var(--teal);fill:none;stroke-width:2;}
  .brand .clinic-slug{color:var(--steel);font-weight:400;font-size:12px;margin-left:6px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--line);}
  .badge.trial{color:var(--amber);background:var(--amber-soft);border-color:rgba(245,165,36,.3);}
  .badge.live{color:var(--teal);background:var(--teal-soft);border-color:rgba(45,212,200,.3);display:flex;align-items:center;gap:6px;}
  .badge.live .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{border-color:rgba(255,255,255,.2);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.primary{background:var(--teal);color:#04211d;border-color:var(--teal);}
  .btn.primary:hover{background:#3ee0d3;}
  .btn.amber{background:var(--amber);color:#2b1a02;border-color:var(--amber);}
  .btn.amber:hover{background:#ffb742;}
  .btn.coral{background:var(--coral);color:#2b0a0a;border-color:var(--coral);}
  .btn.ghost{background:transparent;}
  .btn.sm{padding:8px 12px;font-size:12.5px;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}

  .tabs{display:flex;gap:6px;background:var(--panel2);padding:5px;border-radius:11px;border:1px solid var(--line);
    margin-bottom:20px;overflow-x:auto;}
  .tab{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--steel);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--teal-soft);color:var(--teal);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;}}

  .serving-panel{text-align:center;padding:30px 20px;}
  .serving-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);font-weight:700;margin-bottom:10px;}
  .serving-number{font-family:'IBM Plex Mono',monospace;font-size:72px;font-weight:700;color:var(--teal);line-height:1;}
  .serving-name{margin-top:8px;font-size:15px;color:var(--text);font-weight:600;}
  .serving-empty{color:var(--steel);font-size:14px;margin-top:8px;}
  .action-row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

  .stat-mini{display:flex;gap:14px;margin-top:18px;justify-content:center;flex-wrap:wrap;}
  .stat-mini div{text-align:center;}
  .stat-mini .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;}
  .stat-mini .l{font-size:10.5px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;}

  .qlist{display:flex;flex-direction:column;gap:0;max-height:520px;overflow-y:auto;}
  .qrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .qrow:last-child{border-bottom:none;}
  .qnum{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;width:34px;color:var(--teal);}
  .qinfo{flex:1;min-width:0;}
  .qname{font-size:13.5px;font-weight:600;}
  .qmeta{font-size:11.5px;color:var(--steel);}
  .qrow .btn{padding:6px 10px;font-size:11.5px;}
  .pay-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--steel);font-size:11.5px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .pay-pill.set{color:var(--teal);border-color:rgba(45,212,200,.3);background:var(--teal-soft);}
  .pay-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel2);color:var(--steel);cursor:pointer;white-space:nowrap;margin-right:8px;}
  .pay-pill.set{color:var(--teal);border-color:rgba(45,212,200,.3);background:var(--teal-soft);}
  .pay-pill:hover{border-color:var(--teal);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
  .section-head h3{font-size:14px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;}

  .patient-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:12px;}
  .patient-row:last-child{border-bottom:none;}
  .patient-row:hover{background:rgba(255,255,255,.02);}
  .patient-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .patient-avatar{width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--teal);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
  .patient-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .visit-pill{font-size:11px;font-weight:600;color:var(--steel);background:var(--panel2);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;white-space:nowrap;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;
    stroke:var(--steel);fill:none;stroke-width:2;pointer-events:none;}
  .search-wrap input{padding-left:38px !important;}
  .results-count{font-size:12px;color:var(--steel);margin:-4px 0 12px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--steel);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number]{
    width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;}
  input:focus{outline:none;border-color:var(--teal);}

  .auth-wrap{max-width:400px;margin:80px auto;padding:0 20px;}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;}
  .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .auth-logo svg{width:30px;height:30px;stroke:var(--teal);fill:none;stroke-width:2;}
  .auth-toggle{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:9px;margin-bottom:20px;}
  .auth-toggle div{flex:1;text-align:center;padding:9px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--steel);}
  .auth-toggle div.active{background:var(--teal-soft);color:var(--teal);}
  .err-msg{color:var(--coral);font-size:12.5px;margin-top:8px;}
  .sub{color:var(--steel);font-size:12.5px;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--steel);font-size:13.5px;}

  .doctor-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .doctor-card:last-child{border-bottom:none;}
  .doctor-card .dname{font-weight:700;font-size:14px;}
  .doctor-card .dspec{font-size:12px;color:var(--steel);}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:400px;width:100%;}
  .modal h3{margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}

  .link-box{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--teal);word-break:break-all;}

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
const API_BASE = ""; // relative — this file is served by the same FastAPI app it talks to

/* ============ STATE ============ */
const state = {
  token: localStorage.getItem('cq_token') || null,
  authMode: 'login', authEmail: '', authPassword: '', authClinicName: '', authError: '', authLoading: false,

  profile: null,
  doctors: [], doctorsLoading: false,
  activeDoctorId: null,

  queueData: null, queueLoading: false,
  dashSummary: null,

  view: 'queue', // queue | doctors | billing | patients | support | settings
  billing: null, plans: [], plansLoading: false,
  payments: [], paymentsLoading: false,
  subscribeLoadingPlan: null, subscribeError: '', confirmingPayment: false,
  subscriptionLockOpen: false, subscriptionLockMessage: '', subscriptionLockStatus: '',

  walkinOpen: false, walkinName: '', walkinMobile: '', walkinAmount: '', walkinSaving: false, walkinError: '',
  paymentModal: null, paymentSaving: false, paymentError: '',
  doctorFormOpen: false, doctorFormMode: 'add', doctorFormId: null,
  doctorFormName: '', doctorFormSpec: '', doctorFormMinutes: 6, doctorFormSaving: false, doctorFormError: '',

  queueActionInFlight: false, // guards Next/Skip/Complete/Recall against double-clicks

  // Patients
  patients: [], patientsLoading: false, patientSearch: '',
  patientDetailOpen: false, patientDetail: null, patientDetailLoading: false,

  // Support
  tickets: [], ticketsLoading: false, faq: [], faqLoading: false,
  ticketFormOpen: false, ticketCategory: 'Queue Problem', ticketSubject: '', ticketDescription: '',
  ticketSaving: false, ticketError: '',

  // Settings
  settings: null, settingsLoading: false, settingsSaving: false, settingsError: '', settingsSaved: false,
};

let pollTimer = null;

/* ============ HELPERS ============ */
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(name){
  const M = {
    logo:`<svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>`,
    logout:`<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>`,
    users:`<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    plus:`<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
    next:`<svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>`,
    skip:`<svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><path d="M19 4v16"/></svg>`,
    x:`<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
    card:`<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>`,
    link:`<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5"/></svg>`,
    search:`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  };
  return M[name] || '';
}

async function api(path, {method='GET', body=null, auth=true} = {}){
  const headers = {'Content-Type':'application/json'};
  if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if (!res.ok){
    let detail = 'Request failed', code = null, subStatus = null;
    try{ const j = await res.json(); detail = j.detail || detail; code = j.code || null; subStatus = j.subscription_status || null; } catch(e){}
    const err = new Error(detail);
    err.status = res.status; err.code = code; err.subscriptionStatus = subStatus;
    // Any paid-feature call blocked by the backend (402 SUBSCRIPTION_REQUIRED)
    // pops the same lock modal everywhere, instead of each call site having
    // to know about billing state — the backend is the single source of truth.
    if (res.status === 402 && code === 'SUBSCRIPTION_REQUIRED'){
      state.subscriptionLockOpen = true;
      state.subscriptionLockMessage = detail;
      state.subscriptionLockStatus = subStatus;
      render();
    }
    throw err;
  }
  if (res.status === 204) return null;
  return res.json();
}

async function apiForm(path, formData){
  const res = await fetch(API_BASE + path, {method:'POST', body: formData});
  if (!res.ok){
    let detail = 'Request failed';
    try{ const j = await res.json(); detail = j.detail || detail; } catch(e){}
    throw new Error(detail);
  }
  return res.json();
}

/* ============ AUTH ============ */
async function doSignup(){
  state.authLoading = true; state.authError = ''; render();
  try{
    const data = await api('/auth/signup', {method:'POST', auth:false, body:{
      clinic_name: state.authClinicName, email: state.authEmail, password: state.authPassword
    }});
    state.token = data.access_token; localStorage.setItem('cq_token', state.token);
    await afterLogin();
  } catch(e){ state.authError = e.message; }
  state.authLoading = false; render();
}

async function doLogin(){
  state.authLoading = true; state.authError = ''; render();
  try{
    const form = new URLSearchParams();
    form.append('username', state.authEmail); form.append('password', state.authPassword);
    const data = await apiForm('/auth/login', form);
    state.token = data.access_token; localStorage.setItem('cq_token', state.token);
    await afterLogin();
  } catch(e){ state.authError = e.message; }
  state.authLoading = false; render();
}

function logout(){
  state.token = null; localStorage.removeItem('cq_token');
  state.profile = null; state.doctors = []; state.queueData = null;
  if (pollTimer) clearInterval(pollTimer);
  render();
}

async function afterLogin(){
  await loadProfile();
  await loadBilling();
  await loadDoctors();
  startPolling();
}

/* ============ DATA LOADING ============ */
async function loadProfile(){
  try{ state.profile = await api('/auth/me'); } catch(e){ state.profile = null; }
}

async function loadDoctors(){
  state.doctorsLoading = true; render();
  try{
    state.doctors = await api('/doctors');
    if (!state.activeDoctorId && state.doctors.length) state.activeDoctorId = state.doctors[0].id;
  } catch(e){}
  state.doctorsLoading = false; render();
}

async function loadQueue(){
  if (!state.activeDoctorId) return;
  state.queueLoading = true;
  try{ state.queueData = await api('/queue/' + state.activeDoctorId); } catch(e){}
  state.queueLoading = false; render();
}

async function loadDashboard(){
  try{ state.dashSummary = await api('/dashboard/summary'); } catch(e){}
}

async function loadBilling(){
  try{ state.billing = await api('/billing/status'); } catch(e){}
  render();
}

async function loadPlans(){
  if (state.plans.length) return; // static config, fetch once per session
  state.plansLoading = true; render();
  try{ state.plans = await api('/billing/plans'); } catch(e){}
  state.plansLoading = false; render();
}

async function loadPayments(){
  state.paymentsLoading = true; render();
  try{ state.payments = await api('/billing/payments'); } catch(e){}
  state.paymentsLoading = false; render();
}

function loadRazorpayCheckout(){
  if (window.Razorpay) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://checkout.razorpay.com/v1/checkout.js';
    s.onload = resolve; s.onerror = ()=> reject(new Error('Could not load payment gateway. Check your connection and try again.'));
    document.head.appendChild(s);
  });
}

async function subscribeToPlan(planKey){
  state.subscribeLoadingPlan = planKey; state.subscribeError = ''; render();
  try{
    const sub = await api('/billing/subscribe', {method:'POST', body:{plan: planKey}});
    await loadRazorpayCheckout();
    const rzp = new Razorpay({
      key: sub.razorpay_key_id,
      subscription_id: sub.razorpay_subscription_id,
      name: 'Clinic Queue',
      description: planKey.charAt(0).toUpperCase() + planKey.slice(1) + ' plan',
      theme: { color: '#2dd4c8' },
      // We never trust this handler as proof of payment — the backend only
      // activates the subscription once Razorpay's webhook is verified
      // server-side. This just tells us when to start polling for that.
      handler: function(){ pollForActivation(); },
      modal: { ondismiss: function(){ state.subscribeLoadingPlan = null; render(); } },
    });
    rzp.open();
  } catch(e){
    state.subscribeError = e.message;
  }
  state.subscribeLoadingPlan = null; render();
}

function pollForActivation(){
  state.subscribeError = '';
  state.confirmingPayment = true; render();
  let attempts = 0;
  const iv = setInterval(async ()=>{
    attempts++;
    await loadBilling();
    const active = state.billing && (state.billing.subscription_status === 'active' || state.billing.subscription_status === 'past_due');
    if (active || attempts >= 15){ // ~30s; webhooks normally land in a couple seconds
      clearInterval(iv);
      state.confirmingPayment = false;
      await loadPayments();
      render();
    }
  }, 2000);
}

async function loadPatients(){
  state.patientsLoading = true; render();
  try{
    const qs = state.patientSearch ? ('?q=' + encodeURIComponent(state.patientSearch)) : '';
    state.patients = await api('/patients' + qs);
  } catch(e){}
  state.patientsLoading = false; render();
}

async function openPatientDetail(id){
  state.patientDetailOpen = true; state.patientDetailLoading = true; state.patientDetail = null; render();
  try{ state.patientDetail = await api('/patients/' + id); } catch(e){}
  state.patientDetailLoading = false; render();
}

async function loadTickets(){
  state.ticketsLoading = true; render();
  try{ state.tickets = await api('/support/tickets'); } catch(e){}
  state.ticketsLoading = false; render();
}

async function loadFAQ(){
  state.faqLoading = true; render();
  try{ state.faq = await api('/support/faq'); } catch(e){}
  state.faqLoading = false; render();
}

async function submitTicket(){
  if (!state.ticketSubject.trim() || !state.ticketDescription.trim()){
    state.ticketError = 'Subject and description are required'; render(); return;
  }
  state.ticketSaving = true; state.ticketError = ''; render();
  try{
    await api('/support/tickets', {method:'POST', body:{
      category: state.ticketCategory, subject: state.ticketSubject.trim(), description: state.ticketDescription.trim()
    }});
    state.ticketFormOpen = false; state.ticketSubject=''; state.ticketDescription='';
    await loadTickets();
  } catch(e){ state.ticketError = e.message; }
  state.ticketSaving = false; render();
}

async function loadSettings(){
  state.settingsLoading = true; render();
  try{ state.settings = await api('/settings'); } catch(e){}
  state.settingsLoading = false; render();
}

async function saveSettings(patch){
  state.settingsSaving = true; state.settingsError = ''; state.settingsSaved = false; render();
  try{
    state.settings = await api('/settings', {method:'PUT', body: patch});
    state.settingsSaved = true;
  } catch(e){ state.settingsError = e.message; }
  state.settingsSaving = false; render();
}

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>{
    if (!state.token) return;
    if (state.subscriptionLockOpen) return; // no point hammering a gated endpoint
    if (state.view === 'queue') loadQueue();
  }, 8000);
}

/* ============ ACTIONS ============ */
async function runQueueAction(fn){
  // Prevents accidental double-clicks (e.g. a slow network) from firing the
  // same queue-advancing action twice, which could skip two patients instead
  // of one.
  if (state.queueActionInFlight) return;
  state.queueActionInFlight = true; render();
  try{ await fn(); await loadQueue(); }
  catch(e){ alert(e.message); }
  state.queueActionInFlight = false; render();
}
async function callNext(){
  await runQueueAction(()=> api('/queue/' + state.activeDoctorId + '/next', {method:'POST'}));
}
async function skipCurrent(){
  await runQueueAction(()=> api('/queue/' + state.activeDoctorId + '/skip', {method:'POST'}));
}
async function completeCurrent(){
  await runQueueAction(()=> api('/queue/' + state.activeDoctorId + '/complete', {method:'POST'}));
}
async function recallCurrent(){
  await runQueueAction(()=> api('/queue/' + state.activeDoctorId + '/recall', {method:'POST'}));
}
async function markNoShow(tokenId){
  try{ await api('/queue/token/' + tokenId + '/no-show', {method:'POST'}); await loadQueue(); }
  catch(e){ alert(e.message); }
}
async function submitWalkin(){
  if (!state.walkinName.trim()){ state.walkinError = 'Name is required'; render(); return; }
  let amount = null;
  if (state.walkinAmount && state.walkinAmount.trim() !== ''){
    amount = Number(state.walkinAmount);
    if (isNaN(amount) || amount < 0){ state.walkinError = 'Amount must be a valid positive number'; render(); return; }
  }
  state.walkinSaving = true; state.walkinError = ''; render();
  try{
    await api('/queue/walkin', {method:'POST', body:{
      doctor_id: state.activeDoctorId, patient_name: state.walkinName.trim(), patient_mobile: state.walkinMobile || null,
      amount_paid: amount,
    }});
    state.walkinOpen = false; state.walkinName=''; state.walkinMobile=''; state.walkinAmount='';
    await loadQueue();
  } catch(e){ state.walkinError = e.message; }
  state.walkinSaving = false; render();
}

async function submitDoctorForm(){
  if (!state.doctorFormName.trim()){ state.doctorFormError = 'Name is required'; render(); return; }
  state.doctorFormSaving = true; state.doctorFormError = ''; render();
  try{
    const payload = {
      name: state.doctorFormName.trim(),
      specialization: state.doctorFormSpec || null,
      avg_consult_minutes: Number(state.doctorFormMinutes) || 6,
    };
    if (state.doctorFormMode === 'add'){
      await api('/doctors', {method:'POST', body: payload});
    } else {
      await api('/doctors/' + state.doctorFormId, {method:'PATCH', body: payload});
    }
    state.doctorFormOpen = false;
    await loadDoctors();
  } catch(e){ state.doctorFormError = e.message; }
  state.doctorFormSaving = false; render();
}

function openAddDoctor(){
  state.doctorFormOpen = true; state.doctorFormMode = 'add'; state.doctorFormId = null;
  state.doctorFormName=''; state.doctorFormSpec=''; state.doctorFormMinutes=6; state.doctorFormError=''; render();
}
function openEditDoctor(doc){
  state.doctorFormOpen = true; state.doctorFormMode = 'edit'; state.doctorFormId = doc.id;
  state.doctorFormName = doc.name; state.doctorFormSpec = doc.specialization || ''; state.doctorFormMinutes = doc.avg_consult_minutes;
  state.doctorFormError=''; render();
}
async function deactivateDoctor(id){
  if (!confirm('Deactivate this doctor?')) return;
  try{ await api('/doctors/' + id, {method:'DELETE'}); await loadDoctors(); } catch(e){ alert(e.message); }
}

function renderTopBadge(){
  if (!state.billing) return '';
  const s = state.billing.subscription_status;
  if (s === 'trialing') return `<div class="badge trial">${state.billing.trial_days_left ?? '—'}d left on trial</div>`;
  if (s === 'active') return `<div class="badge live" style="text-transform:capitalize;">${escapeHtml(state.billing.plan)} · Active</div>`;
  if (s === 'past_due') return `<div class="badge trial">Payment issue — grace period</div>`;
  if (s === 'expired') return `<div class="badge" style="color:var(--coral);background:var(--coral-soft);border-color:rgba(255,107,107,.3);">Trial expired</div>`;
  if (s === 'suspended') return `<div class="badge" style="color:var(--coral);background:var(--coral-soft);border-color:rgba(255,107,107,.3);">Subscription suspended</div>`;
  if (s === 'cancelled') return `<div class="badge" style="color:var(--coral);background:var(--coral-soft);border-color:rgba(255,107,107,.3);">Subscription cancelled</div>`;
  return '';
}

/* ============ RENDER: SHELL ============ */
function renderShell(contentEl){
  const root = document.getElementById('root');
  root.innerHTML = '';
  const app = el(`<div class="app"></div>`);

  const billingBadge = renderTopBadge();

  app.appendChild(el(`
    <div class="topbar">
      <div class="brand">${icon('logo')} Clinic Queue ${state.profile?`<span class="clinic-slug">${escapeHtml(state.profile.clinic_name)}</span>`:''}</div>
      <div class="top-right">
        ${billingBadge}

        <button class="btn ghost sm" id="logout-btn">${icon('logout')} Log out</button>
      </div>
    </div>`));

  const tabs = el(`
    <div class="tabs">
      <div class="tab" data-view="queue">Queue</div>
      <div class="tab" data-view="doctors">Doctors</div>
      <div class="tab" data-view="patients">Patients</div>

      <div class="tab" data-view="settings">Settings</div>
      <div class="tab" data-view="billing">Billing</div>
    </div>`);

    if (state.view === 'support'){ loadTickets(); loadFAQ(); }

  if (state.subscriptionLockOpen) app.appendChild(renderSubscriptionLockModal());
}

/* ============ RENDER: QUEUE ============ */
function renderQueue(){
  const wrap = el(`<div></div>`);

  if (state.doctorsLoading){ wrap.appendChild(el(`<div class="empty-state">Loading doctors…</div>`)); renderShell(wrap); return; }
  if (!state.doctors.length){
    wrap.appendChild(el(`<div class="card empty-state">${icon('users')}<div style="margin-top:10px;">No doctors yet. Add one in the Doctors tab to start taking tokens.</div></div>`));
    renderShell(wrap); return;
  }

  const doctorTabs = el(`<div class="tabs" style="margin-bottom:16px;"></div>`);
  state.doctors.forEach(d=>{
    const t = el(`<div class="tab ${d.id===state.activeDoctorId?'active':''}" data-id="${d.id}">${escapeHtml(d.name)}</div>`);
    doctorTabs.appendChild(t);
  });
  wrap.appendChild(doctorTabs);

  const grid = el(`<div class="grid2"></div>`);

  // Left: current serving + actions
  const left = el(`<div class="card serving-panel"></div>`);
  const qd = state.queueData;
  if (qd && qd.current_serving){
    left.appendChild(el(`
      <div class="serving-label">Now serving</div>
      <div class="serving-number">#${qd.current_serving.token_number}</div>
      <div class="serving-name">${escapeHtml(qd.current_serving.patient_name)}</div>`));
    left.appendChild(el(`<div style="margin-top:10px;">${paymentPill(qd.current_serving).outerHTML}</div>`));
  } else {
    left.appendChild(el(`<div class="serving-label">Now serving</div><div class="serving-number">—</div><div class="serving-empty">No patient currently being seen</div>`));
  }
  const actions = el(`<div class="action-row"></div>`);
  const busy = state.queueActionInFlight;
  actions.appendChild(el(`<button class="btn primary" id="btn-next" ${busy?'disabled':''}>${icon('next')} Next patient</button>`));
  actions.appendChild(el(`<button class="btn ghost" id="btn-complete" ${busy || !(qd&&qd.current_serving)?'disabled':''}>Complete</button>`));
  actions.appendChild(el(`<button class="btn ghost" id="btn-recall" ${busy || !(qd&&qd.current_serving)?'disabled':''}>Recall</button>`));
  actions.appendChild(el(`<button class="btn ghost" id="btn-skip" ${busy || !(qd&&qd.current_serving)?'disabled':''}>${icon('skip')} Skip</button>`));
  actions.appendChild(el(`<button class="btn amber" id="btn-walkin" ${busy?'disabled':''}>${icon('plus')} Add walk-in</button>`));
  left.appendChild(actions);

  if (qd){
    const stats = el(`<div class="stat-mini"></div>`);
    stats.appendChild(el(`<div><div class="n" style="color:var(--teal);">${qd.waiting.length}</div><div class="l">Waiting</div></div>`));
    stats.appendChild(el(`<div><div class="n">${qd.done_count}</div><div class="l">Done</div></div>`));
    stats.appendChild(el(`<div><div class="n" style="color:var(--coral);">${qd.no_show_count}</div><div class="l">No-show</div></div>`));
    left.appendChild(stats);
  }
  grid.appendChild(left);

  // Right: waiting list
  const right = el(`<div class="card"></div>`);
  right.appendChild(el(`<h3 style="font-size:14px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;">Waiting list</h3>`));
  const list = el(`<div class="qlist"></div>`);
  if (qd && qd.waiting.length){
    qd.waiting.forEach(t=>{
      const row = el(`
        <div class="qrow">
          <div class="qnum">#${t.token_number}</div>
          <div class="qinfo"><div class="qname">${escapeHtml(t.patient_name)}</div><div class="qmeta">${t.source === 'WALKIN' ? 'Walk-in' : 'Online'}${t.patient_mobile ? ' · ' + escapeHtml(t.patient_mobile) : ''}</div></div>
        </div>`);
      row.appendChild(paymentPill(t));
      row.appendChild(el(`<button class="btn ghost sm" data-noshow="${t.id}">No-show</button>`));
      list.appendChild(row);
    });
  } else {
    list.appendChild(el(`<div class="empty-state">No one waiting right now.</div>`));
  }
  right.appendChild(list);
  grid.appendChild(right);

  wrap.appendChild(grid);

  const publicLink = state.profile ? `${location.origin}/book/${state.profile.clinic_slug}` : '';
  if (publicLink){
    wrap.appendChild(el(`<div class="section-head"><h3>${icon('link')} Patient booking link</h3></div>`));
    wrap.appendChild(el(`<div class="link-box">${escapeHtml(publicLink)}</div>`));
  }

  renderShell(wrap);

  doctorTabs.querySelectorAll('.tab').forEach(tb=> tb.addEventListener('click', ()=>{
    state.activeDoctorId = tb.dataset.id; state.queueData = null; loadQueue();
  }));
  wrap.querySelector('#btn-next').addEventListener('click', callNext);
  wrap.querySelector('#btn-skip').addEventListener('click', skipCurrent);
  wrap.querySelector('#btn-complete').addEventListener('click', completeCurrent);
  wrap.querySelector('#btn-recall').addEventListener('click', recallCurrent);
  wrap.querySelector('#btn-walkin').addEventListener('click', ()=>{ state.walkinOpen = true; state.walkinName=''; state.walkinMobile=''; state.walkinAmount=''; state.walkinError=''; render(); });
  wrap.querySelectorAll('[data-noshow]').forEach(b=> b.addEventListener('click', ()=> markNoShow(b.dataset.noshow)));
  wrap.querySelectorAll('[data-payment-id]').forEach(b=> b.addEventListener('click', ()=>{
    state.paymentModal = {
      id: b.dataset.paymentId,
      name: b.dataset.paymentName,
      tokenNumber: b.dataset.paymentTokenNumber,
      amountInput: b.dataset.paymentAmount || '',
    };
    state.paymentError = ''; render();
  }));

  if (state.walkinOpen) renderWalkinModal();
  if (state.paymentModal) renderPaymentModal();
}

function formatAmount(n){
  const num = Number(n);
  return Number.isInteger(num) ? String(num) : num.toFixed(2);
}

function paymentPill(t){
  const hasAmount = t.amount_paid !== null && t.amount_paid !== undefined;
  const label = hasAmount ? `₹${formatAmount(t.amount_paid)}` : '+ ₹ amount';
  return el(`<button class="pay-pill${hasAmount?' set':''}" data-payment-id="${t.id}" data-payment-amount="${hasAmount?t.amount_paid:''}" data-payment-name="${escapeHtml(t.patient_name)}" data-payment-token-number="${t.token_number}">${label}</button>`);
}

async function submitPayment(clear){
  const pm = state.paymentModal;
  let amount;
  if (clear){
    amount = null;
  } else if (pm.amountInput.trim() === ''){
    amount = null;
  } else {
    amount = Number(pm.amountInput);
    if (isNaN(amount) || amount < 0){ state.paymentError = 'Enter a valid positive amount'; render(); return; }
  }
  state.paymentSaving = true; state.paymentError = ''; render();
  try{
    await api('/queue/token/' + pm.id + '/payment', {method:'PATCH', body:{amount_paid: amount}});
    state.paymentModal = null;
    await loadQueue();
  } catch(e){ state.paymentError = e.message; }
  state.paymentSaving = false; render();
}

function renderPaymentModal(){
  const pm = state.paymentModal;
  const bg = el(`<div class="modal-bg"></div>`);
  const modal = el(`<div class="modal"><h3>Amount collected</h3></div>`);
  modal.appendChild(el(`<div style="color:var(--steel);font-size:12.5px;margin-bottom:10px;">${escapeHtml(pm.name)} — token #${pm.tokenNumber}</div>`));
  modal.appendChild(el(`<div class="field"><label>Amount (₹, optional)</label><input type="text" inputmode="decimal" id="pay-amount" value="${escapeHtml(pm.amountInput)}" placeholder="e.g. 500"/></div>`));
  if (state.paymentError) modal.appendChild(el(`<div class="err-msg">${escapeHtml(state.paymentError)}</div>`));
  const acts = el(`<div class="modal-actions"></div>`);
  acts.appendChild(el(`<button class="btn ghost" id="pay-clear" ${state.paymentSaving?'disabled':''}>Clear</button>`));
  acts.appendChild(el(`<button class="btn ghost" id="pay-cancel" ${state.paymentSaving?'disabled':''}>Cancel</button>`));
  acts.appendChild(el(`<button class="btn primary" id="pay-save" ${state.paymentSaving?'disabled':''}>${state.paymentSaving?'Saving…':'Save'}</button>`));
  modal.appendChild(acts);
  bg.appendChild(modal);
  document.getElementById('root').appendChild(bg);

  modal.querySelector('#pay-amount').addEventListener('input', e=> state.paymentModal.amountInput = e.target.value);
  modal.querySelector('#pay-cancel').addEventListener('click', ()=>{ state.paymentModal = null; state.paymentError=''; render(); });
  modal.querySelector('#pay-clear').addEventListener('click', ()=> submitPayment(true));
  modal.querySelector('#pay-save').addEventListener('click', ()=> submitPayment(false));
  bg.addEventListener('click', e=>{ if (e.target === bg){ state.paymentModal = null; state.paymentError=''; render(); } });
}

/* ============ RENDER: PATIENTS ============ */
function initials(name){
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}

  } else {

    state.patients.forEach(p=>{
      const row = el(`
        <div class="patient-row" data-open="${p.id}" style="cursor:pointer;">

            <div style="min-width:0;">
              <div class="patient-name-row"><span class="dname">${escapeHtml(p.name)}</span><span class="visit-pill">${p.patient_code}</span></div>
              <div class="dspec">${p.mobile ? escapeHtml(p.mobile) : 'No mobile on file'} · registered ${new Date(p.created_at).toLocaleDateString()}</div>
            </div>
          </div>
          <button class="btn ghost sm" data-open2="${p.id}">View profile</button>
        </div>`);
      card.appendChild(row);
    });
  }
  wrap.appendChild(card);
  renderShell(wrap);

  let searchTimer = null;
  wrap.querySelector('#p-search').addEventListener('input', e=>{
    state.patientSearch = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadPatients, 300);
  });
  wrap.querySelectorAll('[data-open], [data-open2]').forEach(elm=> elm.addEventListener('click', ()=> openPatientDetail(elm.dataset.open || elm.dataset.open2)));

  if (state.patientDetailOpen) renderPatientDetailModal();
}

function renderPatientDetailModal(){
  const bg = el(`<div class="modal-bg"></div>`);
  const modal = el(`<div class="modal" style="max-width:520px;"></div>`);
  if (state.patientDetailLoading || !state.patientDetail){
    modal.appendChild(el(`<div class="empty-state">Loading…</div>`));
  } else {
    const d = state.patientDetail;
    modal.appendChild(el(`<h3>${escapeHtml(d.patient.name)}</h3>`));
    modal.appendChild(el(`<div class="dspec" style="margin-bottom:14px;">${d.patient.mobile ? escapeHtml(d.patient.mobile) : 'No mobile on file'} · PAT-${d.patient.patient_code}</div>`));

    const stats = el(`<div class="stat-mini" style="margin-bottom:16px;"></div>`);
    stats.appendChild(el(`<div><div class="n">${d.total_bookings}</div><div class="l">Bookings</div></div>`));
    stats.appendChild(el(`<div><div class="n" style="color:var(--teal);">${d.total_visits}</div><div class="l">Visits</div></div>`));
    stats.appendChild(el(`<div><div class="n" style="color:var(--coral);">${d.no_shows}</div><div class="l">No-shows</div></div>`));
    modal.appendChild(stats);

    modal.appendChild(el(`<h3 style="font-size:13px;color:var(--steel);text-transform:uppercase;margin-bottom:8px;">Visit history</h3>`));
    const list = el(`<div class="qlist" style="max-height:260px;overflow-y:auto;"></div>`);
    if (d.history.length){
      d.history.forEach(h=>{
        list.appendChild(el(`
          <div class="qrow">
            <div class="qnum" style="font-size:14px;">#${h.token_number}</div>
            <div class="qinfo"><div class="qname">${escapeHtml(h.doctor_name)} · ${h.status}</div><div class="qmeta">${h.queue_date} · ${h.source === 'WALKIN' ? 'Walk-in' : 'Online'}</div></div>
            ${(h.amount_paid !== null && h.amount_paid !== undefined) ? `<div class="pay-pill set" style="cursor:default;">₹${formatAmount(h.amount_paid)}</div>` : ''}
          </div>`));
      });
    } else {
      list.appendChild(el(`<div class="empty-state">No visits yet.</div>`));
    }
    modal.appendChild(list);
  }
  const acts = el(`<div class="modal-actions"></div>`);
  acts.appendChild(el(`<button class="btn ghost" id="pd-close">Close</button>`));
  modal.appendChild(acts);
  bg.appendChild(modal);
  document.getElementById('root').appendChild(bg);
  modal.querySelector('#pd-close').addEventListener('click', ()=>{ state.patientDetailOpen=false; render(); });
  bg.addEventListener('click', e=>{ if (e.target === bg){ state.patientDetailOpen=false; render(); } });
}

/* ============ RENDER: SUPPORT ============ */
function renderSupport(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="section-head" style="margin-top:0;">
      <h3>${icon('users')} Help &amp; Support</h3>
      <button class="btn amber sm" id="new-ticket">${icon('plus')} Submit ticket</button>
    </div>`));

  const contact = el(`<div class="card" style="margin-bottom:16px;"></div>`);
  contact.appendChild(el(`<div class="field"><label>Contact support</label><div style="font-weight:700;">zalteom111@gmail.com</div></div>`));
  contact.appendChild(el(`<a class="btn ghost sm" href="mailto:zalteom111@gmail.com" style="text-decoration:none;width:fit-content;">${icon('link')} Email support</a>`));
  wrap.appendChild(contact);

  wrap.appendChild(el(`<h3 style="font-size:13px;color:var(--steel);text-transform:uppercase;margin:16px 0 8px;">Your tickets</h3>`));
  const ticketsCard = el(`<div class="card" style="margin-bottom:16px;"></div>`);
  if (state.ticketsLoading){
    ticketsCard.appendChild(el(`<div class="empty-state">Loading…</div>`));
  } else if (!state.tickets.length){
    ticketsCard.appendChild(el(`<div class="empty-state">No support tickets yet.</div>`));
  } else {
    state.tickets.forEach(t=>{
      ticketsCard.appendChild(el(`
        <div class="doctor-card">
          <div><div class="dname">${escapeHtml(t.subject)}</div><div class="dspec">${escapeHtml(t.category)} · ${t.ticket_number} · ${new Date(t.created_at).toLocaleDateString()}</div></div>
          <div class="badge ${t.status==='OPEN'?'trial':'live'}" style="white-space:nowrap;">${t.status}</div>
        </div>`));
    });
  }
  wrap.appendChild(ticketsCard);

  wrap.appendChild(el(`<h3 style="font-size:13px;color:var(--steel);text-transform:uppercase;margin:16px 0 8px;">FAQ</h3>`));
  const faqCard = el(`<div class="card"></div>`);
  if (state.faqLoading){
    faqCard.appendChild(el(`<div class="empty-state">Loading…</div>`));
  } else {
    state.faq.forEach(f=>{
      faqCard.appendChild(el(`
        <div style="margin-bottom:14px;">
          <div style="font-weight:700;margin-bottom:4px;">${escapeHtml(f.question)}</div>
          <div style="color:var(--steel);font-size:13px;">${escapeHtml(f.answer)}</div>
        </div>`));
    });
  }
  wrap.appendChild(faqCard);
  renderShell(wrap);

  wrap.querySelector('#new-ticket').addEventListener('click', ()=>{
    state.ticketFormOpen = true; state.ticketSubject=''; state.ticketDescription=''; state.ticketError=''; render();
  });

  if (state.ticketFormOpen) renderTicketModal();
}

function renderTicketModal(){
  const bg = el(`<div class="modal-bg"></div>`);
  const modal = el(`<div class="modal"><h3>Submit a support ticket</h3></div>`);
  const catOptions = ['Account/Login','Queue Problem','Booking Problem','Patient Management','WhatsApp Problem','Notification Problem','Technical Problem','Feature Request','Other'];
  const catSelect = el(`<div class="field"><label>Category</label><select id="t-cat">${catOptions.map(c=>`<option value="${c}" ${c===state.ticketCategory?'selected':''}>${c}</option>`).join('')}</select></div>`);
  modal.appendChild(catSelect);
  modal.appendChild(el(`<div class="field"><label>Subject</label><input type="text" id="t-subject" value="${escapeHtml(state.ticketSubject)}"/></div>`));
  modal.appendChild(el(`<div class="field"><label>Description</label><textarea id="t-desc" rows="4" style="width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-family:inherit;">${escapeHtml(state.ticketDescription)}</textarea></div>`));
  if (state.ticketError) modal.appendChild(el(`<div class="err-msg">${escapeHtml(state.ticketError)}</div>`));
  const acts = el(`<div class="modal-actions"></div>`);
  acts.appendChild(el(`<button class="btn ghost" id="t-cancel">Cancel</button>`));
  acts.appendChild(el(`<button class="btn primary" id="t-save" ${state.ticketSaving?'disabled':''}>${state.ticketSaving?'Submitting…':'Submit'}</button>`));
  modal.appendChild(acts);
  bg.appendChild(modal);
  document.getElementById('root').appendChild(bg);

  modal.querySelector('#t-cat').addEventListener('change', e=> state.ticketCategory = e.target.value);
  modal.querySelector('#t-subject').addEventListener('input', e=> state.ticketSubject = e.target.value);
  modal.querySelector('#t-desc').addEventListener('input', e=> state.ticketDescription = e.target.value);
  modal.querySelector('#t-cancel').addEventListener('click', ()=>{ state.ticketFormOpen=false; render(); });
  modal.querySelector('#t-save').addEventListener('click', submitTicket);
  bg.addEventListener('click', e=>{ if (e.target === bg){ state.ticketFormOpen=false; render(); } });
}

/* ============ RENDER: SETTINGS ============ */
function renderSettings(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="section-head" style="margin-top:0;"><h3>${icon('card')} Settings</h3></div>`));
  const card = el(`<div class="card"></div>`);

  if (state.settingsLoading || !state.settings){
    card.appendChild(el(`<div class="empty-state">Loading…</div>`));
    wrap.appendChild(card); renderShell(wrap); return;
  }
  const s = state.settings;

  card.appendChild(el(`<div class="field"><label>Max daily tokens</label><input type="number" id="s-max" value="${s.max_daily_tokens}" min="1"/></div>`));
  card.appendChild(el(`<div class="field"><label>Approaching-turn threshold (patients ahead)</label><input type="number" id="s-thresh" value="${s.approaching_threshold}" min="0"/></div>`));
  card.appendChild(el(`<div class="field"><label>Support email</label><input type="email" id="s-email" value="${escapeHtml(s.support_email || '')}" placeholder="zalteom111@gmail.com"/></div>`));

  const toggleRow = (id, label, checked)=> el(`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);">
      <span>${label}</span>
      <input type="checkbox" id="${id}" ${checked?'checked':''} style="width:18px;height:18px;"/>
    </div>`);
  card.appendChild(toggleRow('s-online', 'Online booking enabled', s.online_booking_enabled));
  card.appendChild(toggleRow('s-walkin', 'Walk-in enabled', s.walkin_enabled));
  card.appendChild(toggleRow('s-wa', 'WhatsApp notifications enabled', s.whatsapp_enabled));

  card.appendChild(el(`<div style="margin-top:14px;font-size:12.5px;color:var(--steel);">
    WhatsApp provider: ${s.whatsapp_provider_configured ? '<span style="color:var(--teal);">connected</span>' : '<span style="color:var(--amber);">not configured</span> — set TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_WHATSAPP_FROM on the server to enable sending.'}
  </div>`));

  if (state.settingsError) card.appendChild(el(`<div class="err-msg" style="margin-top:10px;">${escapeHtml(state.settingsError)}</div>`));
  if (state.settingsSaved) card.appendChild(el(`<div style="color:var(--teal);font-size:13px;margin-top:10px;">Saved.</div>`));

  card.appendChild(el(`<button class="btn primary" id="s-save" style="margin-top:14px;" ${state.settingsSaving?'disabled':''}>${state.settingsSaving?'Saving…':'Save settings'}</button>`));

  wrap.appendChild(card);
  renderShell(wrap);

  wrap.querySelector('#s-save').addEventListener('click', ()=>{
    saveSettings({
      max_daily_tokens: Number(wrap.querySelector('#s-max').value) || s.max_daily_tokens,
      approaching_threshold: Number(wrap.querySelector('#s-thresh').value) || 0,
      support_email: wrap.querySelector('#s-email').value || null,
      online_booking_enabled: wrap.querySelector('#s-online').checked,
      walkin_enabled: wrap.querySelector('#s-walkin').checked,
      whatsapp_enabled: wrap.querySelector('#s-wa').checked,
    });
  });
}

/* ============ RENDER: BILLING ============ */
function renderBilling(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="section-head" style="margin-top:0;"><h3>${icon('card')} Billing</h3></div>`));

  if (!state.billing){
    wrap.appendChild(el(`<div class="card"><div class="empty-state">Loading…</div></div>`));
    renderShell(wrap); return;
  }

  const b = state.billing;
  const statusCard = el(`<div class="card" style="margin-bottom:16px;"></div>`);

  if (state.confirmingPayment){
    statusCard.appendChild(el(`
      <div style="text-align:center;padding:10px 0;">
        <div class="badge trial" style="margin-bottom:10px;">Confirming payment…</div>
        <div style="color:var(--steel);font-size:13px;">This usually takes a few seconds while we verify the payment with Razorpay.</div>
      </div>`));
  } else if (b.subscription_status === 'trialing'){
    statusCard.appendChild(el(`
      <div class="badge trial" style="margin-bottom:10px;">FREE TRIAL</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;margin-bottom:4px;">${b.trial_days_left ?? '—'} days remaining</div>
      <div style="color:var(--steel);font-size:13px;">All Clinic Queue features are active during your trial. Choose a plan below any time — you won't be charged until your trial ends and you confirm payment.</div>
    `));
  } else if (b.subscription_status === 'active'){
    const renewLine = b.current_period_end
      ? `Renews: ${new Date(b.current_period_end).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})}`
      : '';
    statusCard.appendChild(el(`
      <div class="badge live" style="margin-bottom:10px;text-transform:uppercase;"><span class="dot"></span>${escapeHtml(b.plan)}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-bottom:4px;">Active</div>
      ${renewLine ? `<div style="color:var(--steel);font-size:13px;">${renewLine}</div>` : ''}
    `));
  } else if (b.subscription_status === 'past_due'){
    statusCard.appendChild(el(`
      <div class="badge trial" style="margin-bottom:10px;">PAYMENT ISSUE</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-bottom:4px;">Renewal payment failed</div>
      <div style="color:var(--steel);font-size:13px;">We couldn't renew your ${escapeHtml(b.plan)} plan. Your access stays on for a few more days while Razorpay retries — update your payment method to avoid interruption.</div>
    `));
  } else if (b.subscription_status === 'suspended'){
    statusCard.appendChild(el(`
      <div class="badge" style="color:var(--coral);background:var(--coral-soft);border-color:rgba(255,107,107,.3);margin-bottom:10px;">SUSPENDED</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-bottom:4px;">Subscribe to continue using Clinic Queue</div>
      <div style="color:var(--steel);font-size:13px;">Renewal payments failed and the grace period has ended. Your clinic's data is safe — resubscribe below to unlock paid features again immediately.</div>
    `));
  } else if (b.subscription_status === 'cancelled'){
    statusCard.appendChild(el(`
      <div class="badge" style="color:var(--coral);background:var(--coral-soft);border-color:rgba(255,107,107,.3);margin-bottom:10px;">CANCELLED</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-bottom:4px;">Your subscription was cancelled</div>
      <div style="color:var(--steel);font-size:13px;">Subscribe again any time — your clinic's data hasn't gone anywhere.</div>
    `));
  } else { // expired
    statusCard.appendChild(el(`
      <div class="badge" style="color:var(--coral);background:var(--coral-soft);border-color:rgba(255,107,107,.3);margin-bottom:10px;">TRIAL EXPIRED</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-bottom:4px;">Your free trial has ended</div>
      <div style="color:var(--steel);font-size:13px;">Subscribe to continue using Clinic Queue. Nothing has been deleted — your queue, doctors, and patient history are all exactly as you left them.</div>
    `));
  }
  wrap.appendChild(statusCard);

  // ---- Plans ----
  wrap.appendChild(el(`<div class="section-head"><h3>Plans</h3></div>`));
  if (state.subscribeError) wrap.appendChild(el(`<div class="err-msg" style="margin-bottom:12px;">${escapeHtml(state.subscribeError)}</div>`));

  const grid = el(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;"></div>`);
  if (state.plansLoading && !state.plans.length){
    grid.appendChild(el(`<div class="empty-state">Loading plans…</div>`));
  } else {
    state.plans.forEach(p=>{
      const isCurrent = (b.subscription_status === 'active' || b.subscription_status === 'past_due') && b.plan === p.key;
      const loading = state.subscribeLoadingPlan === p.key;
      const card = el(`
        <div class="card" style="${isCurrent ? 'border-color:var(--teal);' : ''}">
          <div style="font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:15px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">${escapeHtml(p.name)}</div>
          <div style="font-size:26px;font-weight:700;margin-bottom:2px;">₹${p.price_inr}<span style="font-size:12px;color:var(--steel);font-weight:400;">/${escapeHtml(p.interval)}</span></div>
          <ul style="margin:12px 0 16px;padding-left:18px;color:var(--steel);font-size:12.5px;line-height:1.9;">
            ${p.features.map(f=>`<li>${escapeHtml(f.replace(/_/g,' '))}</li>`).join('')}
          </ul>
          <button class="btn ${isCurrent ? 'ghost' : 'primary'} sm" style="width:100%;justify-content:center;" data-plan="${p.key}" ${isCurrent||loading?'disabled':''}>
            ${isCurrent ? 'Current plan' : (loading ? 'Opening checkout…' : 'Subscribe')}
          </button>
        </div>`);
      grid.appendChild(card);
    });
  }
  wrap.appendChild(grid);

  // ---- Payment history ----
  wrap.appendChild(el(`<div class="section-head"><h3>Payment history</h3></div>`));
  const payCard = el(`<div class="card"></div>`);
  if (state.paymentsLoading){
    payCard.appendChild(el(`<div class="empty-state">Loading…</div>`));
  } else if (!state.payments.length){
    payCard.appendChild(el(`<div class="empty-state">No payments yet.</div>`));
  } else {
    const list = el(`<div></div>`);
    state.payments.forEach(p=>{
      const amt = p.amount != null ? `₹${(p.amount/100).toFixed(2)}` : '—';
      const when = p.paid_at || p.created_at;
      list.appendChild(el(`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);">
          <div>
            <div style="font-weight:600;text-transform:capitalize;">${escapeHtml(p.plan || '—')} · ${escapeHtml((p.event_type||p.status||'').replace(/_/g,' '))}</div>
            <div style="color:var(--steel);font-size:12px;">${when ? new Date(when).toLocaleString('en-IN') : ''}</div>
          </div>
          <div style="font-weight:700;">${amt}</div>
        </div>`));
    });
    payCard.appendChild(list);
  }
  wrap.appendChild(payCard);

  renderShell(wrap);

  wrap.querySelectorAll('[data-plan]').forEach(btn=> btn.addEventListener('click', ()=> subscribeToPlan(btn.dataset.plan)));
}

/* ============ ROOT RENDER ============ */
function _renderInner(){
  if (!state.token){ renderAuth(); return; }
  if (state.view === 'doctors') renderDoctors();
  else if (state.view === 'billing') renderBilling();
  else if (state.view === 'patients') renderPatients();
  else if (state.view === 'support') renderSupport();
  else if (state.view === 'settings') renderSettings();
  else renderQueue();
}

// Every render() rebuilds the whole screen's DOM from scratch (simple, but it
// means a plain re-render replaces even the <input> the user is actively
// typing in with a brand-new element — which drops focus). That's exactly
// what happened on Patients search: each keystroke's debounced reload called
// render(), so the box lost focus after every single character and had to be
// re-clicked. Fix: remember which element (by id) had focus and where the
// cursor/selection was *before* rebuilding, then restore both afterwards.
function render(){
  const active = document.activeElement;
  const hasSelection = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
  const focusId = active && active.id ? active.id : null;
  const selStart = hasSelection ? active.selectionStart : null;
  const selEnd = hasSelection ? active.selectionEnd : null;

  _renderInner();

  if (focusId){
    const restored = document.getElementById(focusId);
    if (restored){
      restored.focus();
      if (selStart !== null && restored.setSelectionRange){
        try { restored.setSelectionRange(selStart, selEnd); } catch(e){ /* not a text-selectable input, ignore */ }
      }
    }
  }
}

/* ============ INIT ============ */
(async function init(){
  if (state.token){ await afterLogin(); }
  render();
})();
