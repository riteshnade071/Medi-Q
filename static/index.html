<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockroom — AI Loss Prevention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0A0E17; --bg2:#0D1220;
    --glass:rgba(255,255,255,.045); --glass-hi:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.09); --line-hi:rgba(255,255,255,.18);
    --text:#EDEFF5; --steel:#8890A3;
    --mint:#00E6A8; --mint-soft:rgba(0,230,168,.14); --mint-ink:#00382A;
    --violet:#7C6CFF; --violet-soft:rgba(124,108,255,.16);
    --red:#FF5C72; --red-soft:rgba(255,92,114,.14);
    --amber:#FFC24B; --amber-soft:rgba(255,194,75,.14);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);}
  #app, #app *{font-family:'Inter',sans-serif;color:var(--text);}
  #app{
    min-height:100vh;display:flex;position:relative;
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(124,108,255,.16), transparent 60%),
      radial-gradient(900px 560px at -8% 18%, rgba(0,230,168,.12), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .grad-text{background:linear-gradient(90deg,#fff 0%,var(--mint) 60%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}

  .glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}

  /* ---------- signature: pulse-scan bar (evokes AI signal / barcode) ---------- */
  .stripe{
    background:repeating-linear-gradient(90deg,
      var(--mint) 0 2px, transparent 2px 4px, var(--violet) 4px 5px, transparent 5px 9px,
      var(--mint) 9px 12px, transparent 12px 14px, var(--violet) 14px 15px, transparent 15px 20px);
    box-shadow:0 0 18px rgba(0,230,168,.35);
  }

  /* ---------- layout ---------- */
  .sidebar{width:92px;background:rgba(10,14,23,.6);border-right:1px solid var(--line);backdrop-filter:blur(20px);
    display:flex;flex-direction:column;align-items:center;padding:22px 0;flex-shrink:0;position:relative;z-index:2;}
  .sidebar .logo{width:38px;height:28px;border-radius:4px;margin-bottom:26px;
    background:repeating-linear-gradient(90deg, var(--mint) 0 2px, transparent 2px 4px, var(--mint) 4px 5px, transparent 5px 8px, var(--mint) 8px 10px, transparent 10px 13px);
    box-shadow:0 0 16px rgba(0,230,168,.5);}
  .nav-btn{width:62px;height:56px;border:none;background:transparent;color:var(--steel);border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.03em;
    margin-bottom:6px;transition:background .15s,color .15s,box-shadow .15s;}
  .nav-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .nav-btn:hover{background:var(--glass-hi);color:var(--text);}
  .nav-btn.active{background:var(--mint-soft);color:var(--mint);box-shadow:inset 0 0 0 1px rgba(0,230,168,.4), 0 0 18px rgba(0,230,168,.18);}
  .nav-spacer{flex:1;}
  .nav-logout:hover{background:var(--red-soft);color:var(--red);}

  .main{flex:1;min-width:0;padding:36px 44px;max-width:1180px;position:relative;z-index:2;}
  @media (max-width:720px){.main{padding:20px;}.sidebar{width:64px;}.nav-btn{width:48px;font-size:8.5px;}}

  .topline{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;color:var(--mint);text-transform:uppercase;}
  h1.pagehead{font-size:30px;margin:2px 0 26px;font-weight:700;}

  /* ---------- buttons / inputs ---------- */
  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border-radius:10px;border:1px solid var(--line-hi);
    background:var(--glass-hi);color:var(--text);padding:11px 18px;cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s;}
  .btn:hover{border-color:rgba(255,255,255,.32);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;}
  .btn.amber{background:linear-gradient(135deg,var(--mint),#00C293);border:none;color:#00281E;box-shadow:0 0 24px rgba(0,230,168,.35);}
  .btn.amber:hover{box-shadow:0 0 32px rgba(0,230,168,.55);}
  .btn.red{background:var(--red);border:none;color:#2A0008;}
  .btn.green{background:var(--mint);border:none;color:#00281E;}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn.block{width:100%;}

  label{font-size:11.5px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;}
  input,select{width:100%;font-family:'IBM Plex Mono',monospace;font-size:14px;padding:10px 12px;border-radius:9px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);}
  input::placeholder{color:#565E70;}
  input:focus,select:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(0,230,168,.18);}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .check-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .check-row input{width:auto;}
  .check-row label{margin:0;text-transform:none;font-size:13.5px;letter-spacing:0;color:var(--text);}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 500px at 15% 10%, rgba(0,230,168,.16), transparent 55%),
      radial-gradient(900px 600px at 90% 90%, rgba(124,108,255,.18), transparent 55%),
      var(--bg);}
  .ticket{width:390px;border-radius:18px;overflow:hidden;position:relative;z-index:2;
    background:var(--glass);border:1px solid var(--line-hi);backdrop-filter:blur(24px);
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 60px rgba(0,230,168,.08);}
  .ticket-head{padding:26px 28px 20px;border-bottom:1px solid var(--line);}
  .ticket-head .stripe{height:16px;border-radius:4px;margin-bottom:18px;}
  .ticket-head h1{font-size:23px;margin:0;font-weight:700;}
  .ticket-head p{font-size:11.5px;color:var(--steel);margin:5px 0 0;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;}
  .ticket-body{padding:24px 28px 30px;}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border-radius:10px;padding:3px;margin-bottom:20px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--steel);}
  .tab.active{background:var(--glass-hi);color:var(--text);}
  .err-msg{background:var(--red-soft);color:#FF8B9B;border:1px solid rgba(255,92,114,.3);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px;font-weight:500;}
  .ok-msg{background:var(--mint-soft);color:var(--mint);border:1px solid rgba(0,230,168,.3);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px;font-weight:500;}
  .info-msg{background:var(--violet-soft);color:#C3BAFF;border:1px solid rgba(124,108,255,.3);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}

  /* ---------- product table ---------- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .search-box{position:relative;flex:1;max-width:320px;}
  .search-box input{padding-left:34px;}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--steel);fill:none;stroke-width:2;}

  .card{background:var(--glass);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-bottom:20px;backdrop-filter:blur(16px);}
  .row{display:grid;grid-template-columns:5px 1.3fr 1.4fr .8fr .8fr .9fr auto;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .row.head{background:rgba(255,255,255,.02);}
  .row.head span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:700;}
  .row:last-child{border-bottom:none;}
  .row:not(.head):hover{background:rgba(255,255,255,.03);}
  .stock-flag{width:5px;align-self:stretch;border-radius:3px;}
  .flag-ok{background:var(--mint);box-shadow:0 0 8px rgba(0,230,168,.6);}
  .flag-low{background:var(--amber);box-shadow:0 0 8px rgba(255,194,75,.5);}
  .flag-out{background:var(--red);box-shadow:0 0 8px rgba(255,92,114,.5);}
  .flag-na{background:var(--line-hi);}
  .name-cell{font-weight:600;font-size:13.5px;}
  .sub{font-size:11px;color:var(--steel);font-family:'IBM Plex Mono',monospace;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:13px;height:13px;stroke:var(--text);fill:none;stroke-width:2;}
  .icon-btn:hover{background:var(--glass-hi);border-color:var(--line-hi);}
  .empty-state{padding:56px 20px;text-align:center;color:var(--steel);}
  .empty-state svg{width:38px;height:38px;stroke:var(--line-hi);stroke-width:1.5;margin-bottom:12px;}

  .overlay{position:fixed;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
  .modal{width:460px;max-width:100%;background:#11151F;border:1px solid var(--line-hi);border-radius:16px;padding:26px 28px;max-height:88vh;overflow-y:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .modal h2{font-size:19px;margin:0 0 18px;font-weight:700;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

  /* ---------- scan ---------- */
  .scan-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:900px){.scan-grid{grid-template-columns:1fr;}}
  .scan-panel{background:var(--glass);border-radius:var(--radius);border:1px solid var(--line);padding:22px;backdrop-filter:blur(16px);}
  .scan-panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;color:var(--steel);}
  .viewfinder{position:relative;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);}
  .reader-el{width:100%;height:100%;}
  .reader-el video{object-fit:cover;}
  .corner{position:absolute;width:26px;height:26px;pointer-events:none;}
  .c-tl{top:14px;left:14px;border-top:3px solid var(--mint);border-left:3px solid var(--mint);}
  .c-tr{top:14px;right:14px;border-top:3px solid var(--mint);border-right:3px solid var(--mint);}
  .c-bl{bottom:14px;left:14px;border-bottom:3px solid var(--mint);border-left:3px solid var(--mint);}
  .c-br{bottom:14px;right:14px;border-bottom:3px solid var(--mint);border-right:3px solid var(--mint);}
  .cam-placeholder{color:var(--steel);font-size:13px;text-align:center;padding:20px;}
  .usb-hint{font-size:12px;color:var(--steel);margin-top:8px;line-height:1.5;}
  .scan-result{margin-top:18px;padding:16px;border-radius:10px;background:rgba(255,255,255,.03);border:1px dashed var(--line-hi);}
  .scan-result.found{border-style:solid;border-color:rgba(0,230,168,.4);background:var(--mint-soft);}
  .scan-result.notfound{border-style:solid;border-color:rgba(255,92,114,.4);background:var(--red-soft);}
  .pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.2s infinite;box-shadow:0 0 8px rgba(255,92,114,.7);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
  .badge.ok{background:var(--mint-soft);color:var(--mint);}
  .badge.low{background:var(--amber-soft);color:var(--amber);}
  .badge.out{background:var(--red-soft);color:#FF8B9B;}
  .badge.na{background:rgba(255,255,255,.05);color:var(--steel);}

  /* stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:18px 20px;backdrop-filter:blur(16px);position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle, rgba(0,230,168,.25), transparent 70%);}
  .stat-card .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:700;margin-bottom:8px;}
  .stat-card .stat-value{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;}
  .section-head h3{font-size:13.5px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);}

  .gtable{width:100%;border-collapse:collapse;font-size:12.5px;}
  .gtable th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);padding:10px 14px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line);}
  .gtable td{padding:10px 14px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;}
  .gtable tr:last-child td{border-bottom:none;}
  .gtable tr:hover td{background:rgba(255,255,255,.02);}

  /* ---------- help tab ---------- */
  .help-step{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .help-step:last-child{border-bottom:none;}
  .help-step-num{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--mint-soft);color:var(--mint);
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .help-step h4{margin:0 0 4px;font-size:14px;font-weight:700;}
  .help-step p{margin:0;font-size:13px;color:var(--steel);line-height:1.55;}
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item:last-child{border-bottom:none;}
  .faq-q{width:100%;text-align:left;background:transparent;border:none;color:var(--text);cursor:pointer;
    padding:15px 18px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .faq-q:hover{background:rgba(255,255,255,.03);}
  .faq-q .chev{flex-shrink:0;width:16px;height:16px;stroke:var(--steel);fill:none;stroke-width:2;transition:transform .15s;}
  .faq-item.open .faq-q .chev{transform:rotate(180deg);color:var(--mint);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .faq-item.open .faq-a{max-height:400px;}
  .faq-a p{margin:0;padding:0 18px 16px;font-size:13px;color:var(--steel);line-height:1.6;}
  .contact-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .contact-card:last-child{border-bottom:none;}
  .contact-ic{flex-shrink:0;width:36px;height:36px;border-radius:9px;background:var(--violet-soft);color:var(--violet);
    display:flex;align-items:center;justify-content:center;}
  .contact-ic svg{width:17px;height:17px;}
  .contact-card .cc-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);font-weight:700;margin-bottom:2px;}
  .contact-card .cc-value{font-size:13.5px;font-weight:600;}
  .contact-card .cc-value a{color:var(--mint);text-decoration:none;}
  .contact-card .cc-value a:hover{text-decoration:underline;}

  /* cart / sale */
  .cart-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .cart-item:last-child{border-bottom:none;}
  .cart-item .ci-name{flex:1;font-weight:600;font-size:13.5px;}
  .cart-item .ci-sub{font-size:11px;color:var(--steel);font-family:'IBM Plex Mono',monospace;}
  .qty-ctrl{display:flex;align-items:center;gap:7px;}
  .qty-ctrl button{width:25px;height:25px;border-radius:7px;border:1px solid var(--line-hi);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-weight:700;}
  .qty-ctrl span{min-width:20px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .cart-total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-weight:700;font-size:18px;font-family:'Space Grotesk',sans-serif;}
  .cart-total span:last-child{color:var(--mint);}
  .cart-empty{color:var(--steel);font-size:13px;padding:22px 0;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONFIG ============
   Backend confirmed schema (from /docs):
   ProductCreate: sku*, barcode, name*, category, cost_price, sell_price, reorder_level, lead_time_days, track_expiry
   Stock lives in batches (/inventory/*), not on the product itself.
   Exact field names for Sale/Batch/Adjust/WriteOff were partly guessed from schema
   names (SaleCreate, BatchReceive, StockAdjust, WastageWriteOff) since full field
   lists weren't visible. If any action errors, copy the exact error text shown on
   screen and send it back — the field names are a one-line fix.
================================== */
const API_BASE = "https://loss-control-api-db9i.onrender.com";

const state = {
  token: null, email: null,
  view: "products", stockSubView: "products", // products | batches
  authTab: "login",
  products: [], loadingProducts: false, search: "",
  editingProduct: null,
  receivingProduct: null, receiveError: "",
  adjustingProduct: null, adjustError: "",
  writingOffBatch: null, writeOffError: "",
  batches: [], loadingBatches: false, batchError: "",
  authError: "", authOk: "", formError: "",
  scanResult: null, cameraActive: false,
  cart: [], saleError: "", saleOk: "",
  dashLoading: false, dashError: "",
  dashSummary: null, dashBriefing: null,
  stockoutRisks: null, expiryRisks: null, deadStock: null,
  purchaseRecs: null, highRiskAlerts: null, billingStatus: null, movements: null,
  alertSending: false, alertMsg: "",
  openFaqs: new Set([0]),
  language: (localStorage.getItem('lc_lang') || 'en'),
  profile: null, profileLoading: false, profileError: "",
  waNumberInput: "", waSaving: false, waMsg: "",
  digestSending: false, digestMsg: "",
  weeklySending: false, weeklyMsg: "", weeklyDownloading: false,
  chatMessages: [], chatInput: "", chatSending: false, chatError: "",
};

let html5QrCode = null;

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ LANGUAGE (EN / HI) ============ */
const TRANSLATIONS = {
  en: {
    nav_stock: 'Stock', nav_sale: 'Sale', nav_scan: 'Scan', nav_dash: 'Dash', nav_help: 'Help', nav_exit: 'Exit',
    help_title: 'Help & Support', help_eyebrow: 'Support',
    help_howto: 'How to use Stockroom', help_faqs: 'Frequently asked questions', help_contact: 'Contact support',
    help_ask_ai: 'Ask AI', help_ask_ai_sub: 'Ask about your store\u2019s numbers, or how to use any screen.',
    help_ask_placeholder: 'e.g. "Aaj ka loss kitna hai?" or "How do I add a product?"',
    help_send: 'Send', help_thinking: 'Thinking…',
    help_settings: 'WhatsApp & reports',
    help_wa_label: 'WhatsApp number', help_wa_placeholder: '+91XXXXXXXXXX',
    help_save: 'Save', help_send_wa_now: 'Send WhatsApp update now',
    help_send_digest: 'Send daily digest (email + WhatsApp)',
    help_download_weekly: 'Download weekly PDF report', help_email_weekly: 'Email me the weekly report',
    help_store: 'Store',
  },
  hi: {
    nav_stock: 'स्टॉक', nav_sale: 'सेल', nav_scan: 'स्कैन', nav_dash: 'डैश', nav_help: 'मदद', nav_exit: 'बाहर',

/* ============ API HELPER ============ */
async function api(path, {method='GET', body=null, form=false, auth=true} = {}){
  const headers = {};
  if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
  let payload = null;
  if (body){
    if (form){ headers['Content-Type'] = 'application/x-www-form-urlencoded'; payload = new URLSearchParams(body).toString(); }
    else { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  }
  const res = await fetch(API_BASE + path, {method, headers, body: payload});
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok){
    let msg = (data && (data.detail || data.message)) || ('Request failed (' + res.status + ')');
    if (Array.isArray(msg)) msg = msg.map(m=>m.msg||JSON.stringify(m)).join('; ');
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return data;
}

/* ============ AUTH ============ */
async function doLogin(email, password){
  state.authError=''; state.authOk='';
  try{
    const data = await api('/auth/login', {method:'POST', auth:false, form:true, body:{username:email, password}});
    state.token = data.access_token || data.token;
    state.email = email;
    if (!state.token) throw new Error('Login succeeded but no token was returned.');
    state.view = 'products';
    loadProducts();
  } catch(e){ state.authError = e.message; }
  render();
}
async function doSignup(store_name, email, password){
  state.authError=''; state.authOk='';
  try{
    await api('/auth/signup', {method:'POST', auth:false, body:{store_name, email, password}});
    state.authOk = 'Account created — you can log in now.'; state.authTab='login';
  } catch(e){ state.authError = e.message; }
  render();
}
function doLogout(){
  state.token=null; state.email=null; state.view='products'; state.products=[]; state.cart=[];

async function loadProducts(){

function productPayload(v){
  const payload = {
    sku: v.sku, name: v.name,
    barcode: v.barcode || null,
    category: v.category || null,
    cost_price: v.cost_price === '' ? null : Number(v.cost_price),
    sell_price: v.sell_price === '' ? null : Number(v.sell_price),
    reorder_level: v.reorder_level === '' ? null : parseInt(v.reorder_level),
    lead_time_days: v.lead_time_days === '' ? null : parseInt(v.lead_time_days),
    track_expiry: !!v.track_expiry,
  };
  Object.keys(payload).forEach(k => { if (payload[k] === null) delete payload[k]; });
  return payload;
}

}

function stockStatus(p){
  const qty = p.quantity_on_hand ?? p.qty_on_hand ?? p.quantity ?? p.stock ?? p.on_hand ?? null;
  if (qty == null) return 'na';
  const q = Number(qty);
  const reorder = p.reorder_level ?? 5;
  if (q <= 0) return 'out';
  if (q <= reorder) return 'low';
  return 'ok';
}
function stockLabel(status){ return {ok:'In stock', low:'Low', out:'Out', na:'—'}[status]; }
function stockQty(p){
  const qty = p.quantity_on_hand ?? p.qty_on_hand ?? p.quantity ?? p.stock ?? p.on_hand ?? null;
  return qty == null ? '—' : qty;
}

/* ============ SCAN ============ */
async function lookupBarcode(code, onFound){
  code = (code||'').trim();
  if (!code) return;
  state.scanResult = {status:'loading', code}; render();
  try{
    const product = await api('/products/barcode/' + encodeURIComponent(code));
    state.scanResult = {status:'found', code, product};
    if (onFound) onFound(product);
  } catch(e){
    state.scanResult = {status:'notfound', code, error:e.message};
  }
  render();
}

function startCamera(readerId, onCode){
  if (typeof Html5Qrcode === 'undefined'){ alert('Camera scanner library did not load. Check your connection and reload.'); return; }
  state.cameraActive = true; render();
  html5QrCode = new Html5Qrcode(readerId);
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 230, height: 130 } },
    (decodedText) => { onCode(decodedText); },
    () => {}
  ).catch(err => {
    state.cameraActive = false; render();
    alert('Could not start camera: ' + err + '\n\nUse the USB scanner / manual field instead.');
  });
}
function stopCamera(){
  if (html5QrCode && state.cameraActive){ html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{}); }
  state.cameraActive = false;
}

/* ============ SALE / CART ============ */
function addToCart(product){
  const existing = state.cart.find(c => c.product.id === product.id);
  if (existing) existing.qty += 1;
  else state.cart.push({product, qty:1});
  state.saleOk=''; state.saleError='';
  render();
}
function changeCartQty(id, delta){
  const item = state.cart.find(c => c.product.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) state.cart = state.cart.filter(c => c.product.id !== id);
  render();
}
function cartTotal(){
  return state.cart.reduce((sum, c) => sum + (Number(c.product.sell_price||0) * c.qty), 0);
}
async function completeSale(){
  if (state.cart.length === 0) return;
  state.saleError=''; state.saleOk='';
  try{
    const items = state.cart.map(c => ({ product_id: c.product.id, quantity: c.qty }));
    await api('/sales', {method:'POST', body:{items}});
    state.saleOk = 'Sale recorded — ' + state.cart.length + ' item(s), ₹' + cartTotal().toFixed(2);
    state.cart = [];
    await loadProducts();
  } catch(e){ state.saleError = e.message; }
  render();
}

    api('/analytics/stockout-risks'),
    api('/analytics/expiry-risks'),
    api('/analytics/dead-stock'),

    api('/notifications/high-risk'),
    api('/billing/status'),
    api('/inventory/movements'),
  ]);
  const [summary, briefing, stockout, expiry, dead, purchase, highrisk, billing, movements] = results;
  state.dashSummary = summary.status==='fulfilled' ? summary.value : null;
  state.dashBriefing = briefing.status==='fulfilled' ? briefing.value : null;
  state.stockoutRisks = stockout.status==='fulfilled' ? stockout.value : null;
  state.expiryRisks = expiry.status==='fulfilled' ? expiry.value : null;
  state.deadStock = dead.status==='fulfilled' ? dead.value : null;
  state.purchaseRecs = purchase.status==='fulfilled' ? purchase.value : null;
  state.highRiskAlerts = highrisk.status==='fulfilled' ? highrisk.value : null;
  state.billingStatus = billing.status==='fulfilled' ? billing.value : null;
  state.movements = movements.status==='fulfilled' ? movements.value : null;
  const failures = results.filter(r=>r.status==='rejected');

}

function renderStatCards(container, obj){
  if (!obj || typeof obj !== 'object') return;
  const grid = el(`<div class="stat-grid"></div>`);
  Object.entries(obj).forEach(([k,v])=>{
    if (v !== null && typeof v === 'object') return;
    const label = k.replace(/_/g,' ');
    let val = v;
    if (typeof v === 'number' && /price|revenue|total_sales|amount|value/.test(k)) val = '₹' + v;
    grid.appendChild(el(`<div class="stat-card"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${escapeHtml(String(val))}</div></div>`));
  });
  if (grid.children.length) container.appendChild(grid);
}

function renderGenericTable(container, title, data, actionsBuilder){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="section-head"><h3>${escapeHtml(title)}</h3></div>`));
  let rows = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
  if (!rows || rows.length === 0){
    wrap.appendChild(el(`<div class="card"><div class="empty-state">${icon('inbox')}<div>Nothing here right now.</div></div></div>`));
    container.appendChild(wrap);
    return null;
  }
  const keys = Object.keys(rows[0]).filter(k => typeof rows[0][k] !== 'object').slice(0,6);
  const table = el(`<table class="gtable"></table>`);
  const headCells = keys.map(k=>`<th>${escapeHtml(k.replace(/_/g,' '))}</th>`).join('') + (actionsBuilder ? '<th></th>' : '');
  table.appendChild(el(`<thead><tr>${headCells}</tr></thead>`));
  const tbody = el(`<tbody></tbody>`);
  rows.forEach(r=>{
    const tr = el(`<tr>${keys.map(k=>`<td>${escapeHtml(r[k]==null?'—':r[k])}</td>`).join('')}</tr>`);
    if (actionsBuilder){
      const td = el(`<td></td>`);
      td.appendChild(actionsBuilder(r));
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  const card = el(`<div class="card"></div>`);
  card.appendChild(table);
  wrap.appendChild(card);
  container.appendChild(wrap);
  return rows;
}

  if (state.stockSubView === 'products'){
    main.querySelector('#product-search').addEventListener('input', (e)=>{ state.search = e.target.value; render(); });
    main.querySelector('#add-product').addEventListener('click', ()=>{ state.editingProduct = {}; state.formError=''; render(); });
    main.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
      const p = state.products.find(x=>String(x.id)===b.dataset.edit);
      state.editingProduct = Object.assign({}, p); state.formError=''; render();
    }));
    main.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>deleteProduct(b.dataset.del)));
    main.querySelectorAll('[data-receive]').forEach(b=>b.addEventListener('click', ()=>{
      const p = state.products.find(x=>String(x.id)===b.dataset.receive);
      state.receivingProduct = p; state.receiveError=''; render();
    }));
    main.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click', ()=>{
      const p = state.products.find(x=>String(x.id)===b.dataset.adjust);
      state.adjustingProduct = p; state.adjustError=''; render();
    }));
  } else {
    const wob = main.querySelector('#writeoff-btns');
    if (wob) {}
    main.querySelectorAll('[data-writeoff]').forEach(b=>b.addEventListener('click', ()=>{
      const batch = state.batches.find(x=>String(x.id)===b.dataset.writeoff);
      state.writingOffBatch = batch; state.writeOffError=''; render();
    }));
  }

  if (state.editingProduct) renderProductModal();
  if (state.receivingProduct) renderReceiveModal();
  if (state.adjustingProduct) renderAdjustModal();
  if (state.writingOffBatch) renderWriteOffModal();
  document.getElementById('add-product-btn-noop');
}

function renderBatchesInto(main){
  main.appendChild(el(`<div class="info-msg">Batches show what stock arrived and when. Write off a batch here if it's damaged or expired.</div>`));
  if (state.loadingBatches){
    main.appendChild(el(`<div class="card"><div class="empty-state">Loading batches…</div></div>`));
    return;
  }
  if (state.batchError){
    main.appendChild(el(`<div class="err-msg">${escapeHtml(state.batchError)}</div>`));
    return;
  }
  if (!state.batches || state.batches.length === 0){
    main.appendChild(el(`<div class="card"><div class="empty-state">${icon('inbox')}<div>No batches received yet. Go to Products and use "Receive stock".</div></div></div>`));
    return;
  }
  const keys = Object.keys(state.batches[0]).filter(k => typeof state.batches[0][k] !== 'object').slice(0,6);
  const card = el(`<div class="card"></div>`);
  const table = el(`<table class="gtable"></table>`);
  table.appendChild(el(`<thead><tr>${keys.map(k=>`<th>${escapeHtml(k.replace(/_/g,' '))}</th>`).join('')}<th></th></tr></thead>`));
  const tbody = el(`<tbody></tbody>`);
  state.batches.forEach(b=>{
    const tr = el(`<tr>${keys.map(k=>`<td>${escapeHtml(b[k]==null?'—':b[k])}</td>`).join('')}</tr>`);
    const td = el(`<td></td>`);
    td.appendChild(el(`<button class="icon-btn" data-writeoff="${b.id}" title="Write off">${icon('flame')}</button>`));
    tr.appendChild(td);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);
  main.appendChild(card);
}

/* ============ RENDER: DASHBOARD ============ */
function rupees(n){ return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:0}); }

function renderLossHero(main){
  const s = state.dashSummary || {};
  const expiryList = Array.isArray(state.expiryRisks) ? state.expiryRisks : [];
  const deadList = Array.isArray(state.deadStock) ? state.deadStock : [];
  const stockoutList = Array.isArray(state.stockoutRisks) ? state.stockoutRisks : [];

  const expiryLoss = expiryList.reduce((sum,r)=>sum + Number(r.estimated_loss||0), 0);
  const deadValue = deadList.reduce((sum,r)=>sum + Number(r.stock_value||0), 0);
  const totalRisk = s.potential_loss_today != null ? Number(s.potential_loss_today) : (expiryLoss + deadValue);

  main.appendChild(el(`
    <div class="glass" style="border-radius:16px;padding:26px 28px;margin-bottom:22px;border-color:rgba(255,92,114,.35);position:relative;overflow:hidden;">
      <div style="position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle, rgba(255,92,114,.22), transparent 70%);"></div>
      <div class="eyebrow" style="color:var(--red);">Today's business risk</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--steel);margin-top:6px;">TOTAL MONEY AT RISK</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:46px;color:#fff;margin-top:2px;text-shadow:0 0 30px rgba(255,92,114,.4);">${rupees(totalRisk)}</div>
    </div>`));

  const grid = el(`<div class="stat-grid" style="margin-bottom:22px;"></div>`);
  grid.appendChild(el(`
    <div class="stat-card" style="border-color:rgba(255,194,75,.3);">
      <div class="stat-label">⚠️ Expiry risk</div>
      <div class="stat-value" style="color:var(--amber);">${rupees(expiryLoss)}</div>
      <div class="sub" style="margin-top:4px;">${expiryList.length} batch${expiryList.length===1?'':'es'}</div>
    </div>`));
  grid.appendChild(el(`
    <div class="stat-card" style="border-color:rgba(124,108,255,.3);">
      <div class="stat-label">🐌 Dead stock</div>
      <div class="stat-value" style="color:var(--violet);">${rupees(deadValue)}</div>
      <div class="sub" style="margin-top:4px;">${deadList.length} product${deadList.length===1?'':'s'} locked</div>
    </div>`));
  grid.appendChild(el(`
    <div class="stat-card">
      <div class="stat-label">🛒 Stockout risk</div>
      <div class="stat-value">${stockoutList.length} SKU${stockoutList.length===1?'':'s'}</div>
      <div class="sub" style="margin-top:4px;">Rupee value not tracked yet</div>
    </div>`));
  grid.appendChild(el(`
    <div class="stat-card" style="opacity:.6;">
      <div class="stat-label">🔴 Stock mismatch</div>
      <div class="stat-value" style="font-size:15px;">Not tracked yet</div>
      <div class="sub" style="margin-top:4px;">No shrinkage API on backend</div>
    </div>`));
  main.appendChild(grid);

  if (s.todays_sales_amount != null || s.inventory_value != null){
    const row = el(`<div class="stat-grid" style="margin-bottom:22px;"></div>`);
    if (s.todays_sales_amount != null) row.appendChild(el(`<div class="stat-card"><div class="stat-label">Today's sales</div><div class="stat-value">${rupees(s.todays_sales_amount)}</div><div class="sub" style="margin-top:4px;">${s.todays_sales_count ?? 0} transaction${(s.todays_sales_count===1)?'':'s'}</div></div>`));
    if (s.inventory_value != null) row.appendChild(el(`<div class="stat-card"><div class="stat-label">Inventory value</div><div class="stat-value">${rupees(s.inventory_value)}</div></div>`));
    main.appendChild(row);
  }

  const actions = Array.isArray(s.top_actions) ? s.top_actions : [];
  main.appendChild(el(`<div class="section-head"><h3>🤖 Today's actions</h3></div>`));
  const actCard = el(`<div class="card" style="padding:6px 8px;"></div>`);
  if (actions.length === 0){
    actCard.appendChild(el(`<div style="color:var(--steel);font-size:13px;padding:16px;">No urgent actions right now — nice.</div>`));
  } else {
    actions.forEach((a,i)=>{
      actCard.appendChild(el(`
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;${i<actions.length-1?'border-bottom:1px solid var(--line);':''}">
          <div style="flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--mint-soft);color:var(--mint);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;">${i+1}</div>
          <div style="font-size:13.5px;line-height:1.5;padding-top:2px;">${escapeHtml(a)}</div>
        </div>`));
    });
  }
  main.appendChild(actCard);
}

function renderDashboard(){
  const main = el(`<div class="main"></div>`);
  main.appendChild(el(`
    <div class="topline">
      <div><div class="eyebrow">Loss prevention</div><h1 class="pagehead grad-text">Dashboard</h1></div>
      <button class="btn ghost sm" id="refresh-dash">Refresh</button>
    </div>`));

  if (state.dashLoading){
    main.appendChild(el(`<div class="card"><div class="empty-state">Loading today's numbers…</div></div>`));
    renderShell(main);
    main.querySelector('#refresh-dash').addEventListener('click', loadDashboard);
    return;
  }
  if (state.dashError){
    main.appendChild(el(`<div class="err-msg">${escapeHtml(state.dashError)}</div>`));
  } else {
    renderLossHero(main);

    if (state.dashBriefing && typeof state.dashBriefing === 'object'){
      const brief = Object.values(state.dashBriefing).find(v => typeof v === 'string' && v.length > 20);
      if (brief) main.appendChild(el(`<div class="info-msg">${escapeHtml(brief)}</div>`));
    }

    // High-risk alerts with a send-alert action
    main.appendChild(el(`<div class="section-head"><h3>High-risk alerts</h3></div>`));
    const alertCard = el(`<div class="card" style="padding:16px;"></div>`);
    const rows = Array.isArray(state.highRiskAlerts) ? state.highRiskAlerts : (state.highRiskAlerts && state.highRiskAlerts.items) || [];
    if (rows.length === 0){
      alertCard.appendChild(el(`<div style="color:var(--steel);font-size:13px;padding:6px 0;">No high-risk items right now.</div>`));
    } else {
      const keys = Object.keys(rows[0]).filter(k => typeof rows[0][k] !== 'object').slice(0,5);
      const table = el(`<table class="gtable"></table>`);
      table.appendChild(el(`<thead><tr>${keys.map(k=>`<th>${escapeHtml(k.replace(/_/g,' '))}</th>`).join('')}</tr></thead>`));
      const tbody = el(`<tbody></tbody>`);
      rows.forEach(r=>tbody.appendChild(el(`<tr>${keys.map(k=>`<td>${escapeHtml(r[k]==null?'—':r[k])}</td>`).join('')}</tr>`)));
      table.appendChild(tbody);
      alertCard.appendChild(table);
    }
    main.appendChild(alertCard);
    const alertBtnWrap = el(`<div style="margin:10px 0 24px;display:flex;align-items:center;gap:12px;">
      <button class="btn ghost sm" id="send-alert">${icon('bell')} ${state.alertSending ? 'Sending…' : 'Send daily alert'}</button>
      <span class="sub" id="alert-msg">${escapeHtml(state.alertMsg)}</span>
    </div>`);
    main.appendChild(alertBtnWrap);

    if (state.billingStatus) { main.appendChild(el(`<div class="section-head"><h3>Billing</h3></div>`)); renderStatCards(main, state.billingStatus); }

    renderGenericTable(main, 'Stockout risks', state.stockoutRisks);
    renderGenericTable(main, 'Expiry risks', state.expiryRisks);
    renderGenericTable(main, 'Dead stock', state.deadStock);
    renderGenericTable(main, 'Purchase recommendations', state.purchaseRecs);
    renderGenericTable(main, 'Recent stock movements', state.movements);
  }
  renderShell(main);
  main.querySelector('#refresh-dash').addEventListener('click', loadDashboard);
  const sendBtn = main.querySelector('#send-alert');
  if (sendBtn) sendBtn.addEventListener('click', sendDailyAlert);
}

/* ============ HELP: API HELPERS ============ */
async function loadProfile(){
  if (state.profileLoading) return;
  state.profileLoading = true; state.profileError = ""; render();
  try{
    const data = await api('/auth/me');
    state.profile = data;
    state.waNumberInput = data.whatsapp_number || "";
  } catch(e){ state.profileError = e.message; }
  state.profileLoading = false; render();
}

async function saveWhatsappNumber(){
  state.waSaving = true; state.waMsg = ""; render();
  try{
    const data = await api('/auth/me', {method:'PATCH', body:{whatsapp_number: state.waNumberInput || null}});
    state.profile = data;
    state.waMsg = 'Saved.';
  } catch(e){ state.waMsg = e.message; }
  state.waSaving = false; render();
}

async function sendWhatsappNow(){
  state.waSaving = true; state.waMsg = ""; render();
  try{
    const data = await api('/notifications/send-whatsapp-alert', {method:'POST'});
    state.waMsg = data.sent ? 'Sent!' : (data.error || 'Could not send.');
  } catch(e){ state.waMsg = e.message; }
  state.waSaving = false; render();
}

async function sendDailyDigestNow(){
  state.digestSending = true; state.digestMsg = ""; render();
  try{
    const data = await api('/notifications/send-daily-digest', {method:'POST'});
    const parts = [];
    if (data.email) parts.push('Email: ' + (data.email.sent ? 'sent' : (data.email.error || 'failed')));
    if (data.whatsapp) parts.push('WhatsApp: ' + (data.whatsapp.sent ? 'sent' : (data.whatsapp.error || 'failed')));
    state.digestMsg = parts.join(' · ');
  } catch(e){ state.digestMsg = e.message; }
  state.digestSending = false; render();
}

async function emailWeeklyReportNow(){
  state.weeklySending = true; state.weeklyMsg = ""; render();
  try{
    const data = await api('/notifications/send-weekly-report', {method:'POST'});
    state.weeklyMsg = data.sent ? 'Emailed!' : (data.error || 'Could not send.');
  } catch(e){ state.weeklyMsg = e.message; }
  state.weeklySending = false; render();
}

async function downloadWeeklyReportNow(){
  state.weeklyDownloading = true; state.weeklyMsg = ""; render();
  try{
    const res = await fetch(API_BASE + '/notifications/weekly-report.pdf', {
      headers: { 'Authorization': 'Bearer ' + state.token },
    });
    if (!res.ok) throw new Error('Download failed (' + res.status + ')');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'weekly-report.pdf'; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  } catch(e){ state.weeklyMsg = e.message; }
  state.weeklyDownloading = false; render();
}

async function sendChatMessage(){
  const question = state.chatInput.trim();
  if (!question || state.chatSending) return;
  state.chatMessages.push({ role: 'user', text: question });
  state.chatInput = ""; state.chatSending = true; state.chatError = ""; render();
  try{
    const data = await api('/assistant/ask', {method:'POST', body:{question}});
    state.chatMessages.push({ role: 'assistant', text: data.answer });
  } catch(e){ state.chatError = e.message; }
  state.chatSending = false; render();
}

  btnWrap.appendChild(el(`<button class="btn ghost sm" id="send-digest" ${state.digestSending?'disabled':''}>${icon('bell')} ${escapeHtml(t('help_send_digest'))}</button>`));
  btnWrap.appendChild(el(`<button class="btn ghost sm" id="weekly-download" ${state.weeklyDownloading?'disabled':''}>${icon('book')} ${escapeHtml(t('help_download_weekly'))}</button>`));
  btnWrap.appendChild(el(`<button class="btn ghost sm" id="weekly-email" ${state.weeklySending?'disabled':''}>${icon('mail')} ${escapeHtml(t('help_email_weekly'))}</button>`));
  settingsCard.appendChild(btnWrap);
  const msgs = [state.waMsg, state.digestMsg, state.weeklyMsg].filter(Boolean).join(' · ');
  if (msgs) settingsCard.appendChild(el(`<div class="sub" style="margin-top:10px;">${escapeHtml(msgs)}</div>`));
  main.appendChild(settingsCard);

  /* ---- Contact ---- */
  main.appendChild(el(`<div class="section-head"><h3>${t('help_contact')}</h3></div>`));
  const contactCard = el(`<div class="card"></div>`);
  contactCard.appendChild(el(`
    <div class="contact-card">
      <div class="contact-ic">${icon('mail')}</div>
      <div><div class="cc-label">Email</div><div class="cc-value"><a href="mailto:support@stockroom.app">support@stockroom.app</a></div></div>
    </div>`));
  contactCard.appendChild(el(`
    <div class="contact-card">
      <div class="contact-ic">${icon('phone')}</div>
      <div><div class="cc-label">Phone / WhatsApp</div><div class="cc-value">+91 00000 00000</div></div>
    </div>`));
  contactCard.appendChild(el(`
    <div class="contact-card">
      <div class="contact-ic">${icon('activity')}</div>
      <div><div class="cc-label">Response time</div><div class="cc-value" style="font-weight:500;color:var(--steel);">Usually within one business day</div></div>
    </div>`));
  main.appendChild(contactCard);
  main.appendChild(el(`<div class="sub" style="margin-top:10px;">${escapeHtml(t('help_store'))}: ${escapeHtml(state.email || '\u2014')}</div>`));

  renderShell(main);

  /* ---- wire up events ---- */
  const langTabs = main.querySelectorAll('.tab[data-lang]');
  langTabs.forEach(tb=>{
    if (tb.dataset.lang === state.language) tb.classList.add('active');
    tb.addEventListener('click', ()=> setLanguage(tb.dataset.lang));
  });

  main.querySelectorAll('.faq-q').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      if (state.openFaqs.has(idx)) state.openFaqs.delete(idx); else state.openFaqs.add(idx);
      render();
    });
  });

  const chatInput = main.querySelector('#chat-input');
  const chatSend = main.querySelector('#chat-send');
  if (chatInput){
    chatInput.addEventListener('input', ()=>{ state.chatInput = chatInput.value; });
    chatInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter'){ e.preventDefault(); sendChatMessage(); } });
  }
  if (chatSend) chatSend.addEventListener('click', sendChatMessage);

  const waInput = main.querySelector('#wa-number');
  if (waInput) waInput.addEventListener('input', ()=>{ state.waNumberInput = waInput.value; });
  const waSave = main.querySelector('#wa-save');
  if (waSave) waSave.addEventListener('click', saveWhatsappNumber);
  const waSendNow = main.querySelector('#wa-send-now');
  if (waSendNow) waSendNow.addEventListener('click', sendWhatsappNow);
  const digestBtn = main.querySelector('#send-digest');
  if (digestBtn) digestBtn.addEventListener('click', sendDailyDigestNow);
  const weeklyDl = main.querySelector('#weekly-download');
  if (weeklyDl) weeklyDl.addEventListener('click', downloadWeeklyReportNow);
  const weeklyEm = main.querySelector('#weekly-email');
  if (weeklyEm) weeklyEm.addEventListener('click', emailWeeklyReportNow);
}

/* ============ ROOT RENDER ============ */
function render(){
  if (!state.token){ renderLogin(); return; }
  if (state.view === 'sale') renderSale();
  else if (state.view === 'scan') renderScan();
  else if (state.view === 'dashboard') renderDashboard();
  else if (state.view === 'help') renderHelp();
  else renderProducts();
}
render();
</script>
</body>
</html>
